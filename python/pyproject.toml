[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "northsun"
version = "0.0.1"
description = "Northsun Python package placeholder."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Northsun" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]
keywords = ["northsun", "ai-agents", "memory"]

[project.urls]
Homepage = "https://northsun.ai"
Repository = "https://github.com/northsun-ai/northsun-core"
Issues = "https://github.com/northsun-ai/northsun-core/issues"

[project.scripts]
northsun = "northsun:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
